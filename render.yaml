services:
  - type: web
    name: plant-analysis-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHONPATH
        value: .
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: BOT_TOKEN
        value: "8939401003:AAGO2fMFsR489ZisMQO4DGZBETAt6W478ag"
      - key: PYTHON_VERSION
        value: 3.11.8
